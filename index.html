<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Coin Hunt AR</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="pre-ar">
    <h1>Coin Hunt AR</h1>
    <p class="hint">Use Chrome on a phone with ARCore. Allow camera when prompted.</p>
    <button type="button" id="btn-start" disabled>Start AR</button>
    <p id="status" class="status" aria-live="polite"></p>
  </div>
  <div id="dom-overlay-root" class="overlay-root" hidden>
    <div class="counter-bar">
      <span class="counter-label">Coins</span>
      <span id="coin-count" class="counter-value">0</span>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
