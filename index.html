<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR Coin Collector</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="container">
            <h1 class="title">AR Coin Collector</h1>
            <p class="instructions">Walk around and collect floating coins in augmented reality!</p>
            <button id="startButton" class="btn-primary">Start AR Game</button>
            <div id="arNotSupported" class="warning hidden">
                Your device doesn't support camera access. Please allow camera permissions.
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Video Background for AR -->
        <video id="cameraFeed" autoplay playsinline muted></video>
        
        <!-- Score Display -->
        <div id="scoreDisplay" class="score-overlay">
            <div class="score-label">Score</div>
            <div id="scoreValue" class="score-value">0</div>
        </div>

        <!-- Instructions Overlay -->
        <div id="instructionsOverlay" class="instructions-overlay">
            <p>Tap on coins to collect them!</p>
        </div>

        <!-- A-Frame Scene (transparent, overlaid on camera) -->
        <a-scene 
            id="arScene"
            embedded 
            vr-mode-ui="enabled: false"
            renderer="alpha: true; antialias: true; colorManagement: true;"
            loading-screen="enabled: false"
            background="color: transparent">
            
            <!-- Assets -->
            <a-assets timeout="10000">
                <a-asset-item id="coinModel" src="Copilot3D-d9aba749-7d22-4170-8f7d-3991895511f0.glb"></a-asset-item>
            </a-assets>
            
            <!-- Lighting for 3D models -->
            <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
            <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 1"></a-light>
            <a-light type="directional" color="#ffd700" intensity="0.5" position="-1 1 -1"></a-light>
            
            <!-- Camera with cursor for raycasting -->
            <a-entity id="cameraRig" position="0 1.6 0">
                <a-camera 
                    id="mainCamera"
                    look-controls="enabled: true; touchEnabled: true; magicWindowTrackingEnabled: true"
                    wasd-controls="enabled: false">
                    <a-cursor 
                        id="cursor"
                        fuse="false"
                        raycaster="objects: .coin; far: 20"
                        material="color: white; shader: flat"
                        geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03">
                    </a-cursor>
                </a-camera>
            </a-entity>
            
            <!-- Coins Container -->
            <a-entity id="coinsContainer"></a-entity>
        </a-scene>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <div class="container">
            <h1 class="title">Game Complete!</h1>
            <div class="final-score-container">
                <p class="final-score-label">Final Score</p>
                <p id="finalScore" class="final-score-value">0</p>
            </div>
            <button id="restartButton" class="btn-primary">Play Again</button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Initializing Camera...</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
