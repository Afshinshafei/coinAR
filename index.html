<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR Coin Collector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="container">
            <div class="coin-icon">&#x1FA99;</div>
            <h1 class="title">AR Coin Collector</h1>
            <p class="instructions">Walk around and collect floating coins in augmented reality!</p>
            <button id="startButton" class="btn-primary">
                <span class="btn-icon">&#9658;</span>
                Start AR Game
            </button>
            <div id="arNotSupported" class="warning hidden">
                Camera access is required. Please allow camera permissions and reload.
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Video Background for AR -->
        <video id="cameraFeed" autoplay playsinline muted></video>
        
        <!-- Canvas for 3D rendering -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Score Display -->
        <div id="scoreDisplay" class="score-overlay">
            <div class="score-label">Score</div>
            <div id="scoreValue" class="score-value">0</div>
        </div>

        <!-- Coins remaining -->
        <div id="coinsRemaining" class="coins-remaining">
            <span id="coinsLeft">8</span> coins left
        </div>

        <!-- Instructions Overlay -->
        <div id="instructionsOverlay" class="instructions-overlay">
            <p>Look around and tap coins to collect them!</p>
        </div>

        <!-- Crosshair -->
        <div id="crosshair" class="crosshair"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <div class="container">
            <div class="trophy-icon">&#127942;</div>
            <h1 class="title">Game Complete!</h1>
            <div class="final-score-container">
                <p class="final-score-label">Final Score</p>
                <p id="finalScore" class="final-score-value">0</p>
            </div>
            <button id="restartButton" class="btn-primary">
                <span class="btn-icon">&#8635;</span>
                Play Again
            </button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Initializing Camera...</p>
    </div>

    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="game.js"></script>
</body>
</html>
