<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Coin Hunter AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <div class="start-content">
            <h1>COIN HUNTER</h1>
            <p>Find and collect floating coins in AR!</p>
            <button id="start-btn">START AR</button>
            <p class="instructions">Walk through coins to collect them</p>
        </div>
    </div>

    <!-- Game UI Overlay -->
    <div id="game-ui" class="hidden">
        <div id="score-container">
            <span id="coin-icon">&#x1FA99;</span>
            <span id="score">0</span>
        </div>
        <div id="message"></div>
    </div>

    <!-- A-Frame Scene -->
    <a-scene
        id="ar-scene"
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #game-ui;"
        renderer="colorManagement: true; physicallyCorrectLights: true;"
        ar-hit-test="enabled: true; type: footprint;"
        class="hidden"
    >
        <!-- Assets -->
        <a-assets>
            <a-asset-item id="coin-model" src="coind3d.glb"></a-asset-item>
        </a-assets>

        <!-- Lighting for AR -->
        <a-entity light="type: ambient; color: #FFF; intensity: 0.7;"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8;" position="1 4 2"></a-entity>

        <!-- Container for spawned coins -->
        <a-entity id="coins-container"></a-entity>

        <!-- Camera (AR mode uses device camera) -->
        <a-entity id="camera-rig">
            <a-camera id="camera" position="0 1.6 0"></a-camera>
        </a-entity>

        <!-- Reticle for surface detection visualization -->
        <a-entity id="reticle" visible="false">
            <a-ring color="#FFD700" radius-inner="0.04" radius-outer="0.06" rotation="-90 0 0" material="opacity: 0.8; transparent: true;"></a-ring>
        </a-entity>
    </a-scene>

    <script src="game.js"></script>
</body>
</html>
