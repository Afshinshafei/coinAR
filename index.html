<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR Coin Collector</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="container">
            <h1 class="title">AR Coin Collector</h1>
            <p class="instructions">Walk around and collect coins in augmented reality!</p>
            <button id="startButton" class="btn-primary">Start AR Game</button>
            <div id="arNotSupported" class="warning hidden">
                Your device doesn't support AR. Please use a compatible device with AR capabilities.
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Score Display -->
        <div id="scoreDisplay" class="score-overlay">
            <div class="score-label">Score</div>
            <div id="scoreValue" class="score-value">0</div>
        </div>

        <!-- Instructions Overlay -->
        <div id="instructionsOverlay" class="instructions-overlay">
            <p>Tap on coins to collect them!</p>
        </div>

        <!-- A-Frame AR Scene -->
        <a-scene 
            id="arScene"
            embedded 
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            vr-mode-ui="enabled: false"
            renderer="logarithmicDepthBuffer: true; precision: medium;"
            loading-screen="enabled: false">
            
            <!-- Camera -->
            <a-camera gps-camera rotation-reader look-controls-enabled="false"></a-camera>
            
            <!-- Coins will be added here dynamically -->
        </a-scene>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen">
        <div class="container">
            <h1 class="title">Game Complete!</h1>
            <div class="final-score-container">
                <p class="final-score-label">Final Score</p>
                <p id="finalScore" class="final-score-value">0</p>
            </div>
            <button id="restartButton" class="btn-primary">Play Again</button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Initializing AR...</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
